<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proto Planet Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 50%, #001a35 0%, #00050a 100%);
            font-family: 'Inter', sans-serif;
            color: #eee;
        }
        canvas { display: block; }

        .info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #cce7ff;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            font-size: 16px;
        }

        .ui {
            position: absolute;
            left: 16px;
            bottom: 16px;
            z-index: 10;
            background: rgba(0, 25, 50, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cce7ff;
            padding: 12px 14px;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            max-height: 70vh;
            overflow-y: auto;
        }

        .ui label {
            font-size: 12px;
            color: #b3d9ff;
            display: block;
            margin-bottom: 6px;
        }

        .ui input[type=range] {
            width: 240px;
            accent-color: #4FC3F7;
            margin-bottom: 10px;
        }

        .ui input[type=text] {
            width: 240px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #cce7ff;
            padding: 5px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .ui button {
            background: rgba(79, 195, 247, 0.2);
            border: 1px solid rgba(79, 195, 247, 0.4);
            color: #cce7ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px 16px;
            margin: 5px 5px 5px 0;
        }

        .ui button:hover {
            background: rgba(79, 195, 247, 0.3);
            border-color: rgba(79, 195, 247, 0.6);
        }

        .ui button.active {
            background: #4FC3F7;
            color: #000;
        }

        .value {
            font-weight: 700;
            color: #fff;
        }

        .section {
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #4FC3F7;
            margin-bottom: 8px;
        }

        /* Debug overlay styles */
        #debug-overlay {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 25, 50, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cce7ff;
            padding: 15px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            line-height: 1.4;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            display: none;
        }

        /* Progress panel */
        #progressPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 25, 50, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cce7ff;
            padding: 20px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="info">Proto Planet Generator - Drag to Rotate, Scroll to Zoom</div>

    <!-- Viewport Frame for proto.js -->
    <div id="viewportFrame" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;"></div>

    <!-- Proto.js required UI elements -->
    <div id="helpPanel" style="display: none;"></div>
    <div id="controlPanel" style="display: none;"></div>
    <div id="dataPanel" style="display: none;"></div>
    <div id="updatePanel" style="display: none;"></div>

    <!-- Proto.js buttons (hidden, will be controlled by our UI) -->
    <div style="display: none;">
        <button id="showSunlightButton"></button>
        <button id="showPlateBoundariesButton"></button>
        <button id="showPlateMovementsButton"></button>
        <button id="showAirCurrentsButton"></button>
        <button id="lowDetailButton"></button>
        <button id="mediumDetailButton"></button>
        <button id="highDetailButton"></button>
        <button id="generatePlanetButton"></button>
        <button id="advancedSettingsButton"></button>
    </div>

    <!-- Debug Info Overlay -->
    <div id="debug-overlay">
        <div id="debug-content">Hover over a tile to see debug info</div>
    </div>

    <!-- Progress Panel -->
    <div id="progressPanel" style="display: none;">
        <div id="progressActionLabel">Generating Planet...</div>
        <div id="progressBarFrame" style="background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; margin: 10px 0;">
            <div id="progressBar" style="background: #4FC3F7; height: 100%; border-radius: 5px; width: 0%; transition: width 0.3s;"></div>
        </div>
        <div id="progressBarLabel">Initializing...</div>
    </div>

    <!-- Main UI Panel -->
    <div class="ui">
        <div class="section">
            <div class="section-title">Planet Generation</div>
            <button id="generateButton">Generate New Planet</button>
            <button id="advancedButton">Advanced Settings</button>
        </div>

        <div class="section">
            <div class="section-title">Rendering</div>
            <button id="terrainButton" class="active">Terrain</button>
            <button id="plateButton">Plates</button>
            <button id="temperatureButton">Temperature</button>
            <button id="moistureButton">Moisture</button>
        </div>

        <div class="section">
            <div class="section-title">Lighting & Effects</div>
            <button id="sunlightButton" class="active">Sunlight: On</button>
            <button id="debugModeButton">Debug Mode: Off</button>
        </div>

        <div class="section">
            <div class="section-title">View Controls</div>
            <label>Detail Level: <span class="value" id="detailValue">Medium</span></label>
            <input type="range" id="detailRange" min="0" max="2" value="1" step="1">

            <label>Sun Time: <span class="value" id="sunTimeValue">0</span></label>
            <input type="range" id="sunTimeRange" min="-180" max="180" value="0">

            <label>Zoom: <span class="value" id="zoomValue">1.0</span></label>
            <input type="range" id="zoomRange" min="0.5" max="3.0" value="1.0" step="0.1">
        </div>
    </div>

    <!-- Advanced Settings Panel (initially hidden) -->
    <div id="generationSettingsPanel" style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 25, 50, 0.95);
        backdrop-filter: blur(12px);
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #cce7ff;
        padding: 20px;
        font-family: 'Inter', sans-serif;
        box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        z-index: 1000;
        display: none;
        max-width: 400px;
        width: 90%;
    ">
        <div class="section-title" style="text-align: center; margin-bottom: 20px;">Advanced Planet Settings</div>

        <div class="section">
            <label>Detail Level: <span class="value" id="detailLevelLabel">Medium</span></label>
            <input type="range" id="detailLevelRange" min="10" max="30" value="20">

            <label>Distortion Level: <span class="value" id="distortionLevelLabel">100%</span></label>
            <input type="range" id="distortionLevelRange" min="0" max="200" value="100">

            <label>Tectonic Plates: <span class="value" id="tectonicPlateCountLabel">50</span></label>
            <input type="range" id="tectonicPlateCountRange" min="200" max="1000" value="500">

            <label>Oceanic Rate: <span class="value" id="oceanicRateLabel">70%</span></label>
            <input type="range" id="oceanicRateRange" min="0" max="100" value="70">

            <label>Heat Level: <span class="value" id="heatLevelLabel">100%</span></label>
            <input type="range" id="heatLevelRange" min="0" max="100" value="0">

            <label>Moisture Level: <span class="value" id="moistureLevelLabel">100%</span></label>
            <input type="range" id="moistureLevelRange" min="0" max="100" value="0">

            <label>Seed:</label>
            <input type="text" id="seedTextBox" placeholder="Random seed (optional)">
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button id="advancedGeneratePlanetButton">Generate Planet</button>
            <button id="advancedCancelButton">Cancel</button>
        </div>
    </div>

    <!-- Include Three.js r121 - more compatible with proto.js while still modern -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>

    <!-- Include jQuery and jQuery UI for proto.js compatibility -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>

    <!-- Three.js r121 Compatibility Layer -->
    <script>
        console.log('Loading Three.js r121 compatibility layer...');

        // Check if THREE.Projector exists in r121, if not create it
        if (typeof THREE.Projector === 'undefined') {
            THREE.Projector = function() {
                // Return object with methods that proto.js expects
                return {
                    pickingRay: function(vector, camera) {
                        if (!window.raycaster) {
                            window.raycaster = new THREE.Raycaster();
                        }
                        window.raycaster.setFromCamera(vector, camera);
                        return window.raycaster;
                    },
                    unprojectVector: function(vector, camera) {
                        return vector.unproject(camera);
                    },
                    projectVector: function(vector, camera) {
                        return vector.project(camera);
                    }
                };
            };
        }

        // Check if THREE.Geometry still exists in r121, if not create stub
        if (typeof THREE.Geometry === 'undefined') {
            THREE.Geometry = function() {
                // Create a proper BufferGeometry instead
                const bufferGeometry = new THREE.BufferGeometry();
                // Add legacy properties for compatibility
                bufferGeometry.vertices = [];
                bufferGeometry.faces = [];
                bufferGeometry.colors = [];
                return bufferGeometry;
            };
        }

        // Check if THREE.Face3 still exists in r121, if not create stub
        if (typeof THREE.Face3 === 'undefined') {
            THREE.Face3 = function(a, b, c, normal, colors) {
                // Legacy Face3 object structure
                this.a = a;
                this.b = b;
                this.c = c;
                this.normal = normal || new THREE.Vector3();
                this.vertexColors = colors || [];
            };
        }

        // Check if we still need compatibility constants in r121
        if (typeof THREE.CullFaceFront === 'undefined') {
            THREE.CullFaceFront = 1;
        }
        if (typeof THREE.FrontFaceDirectionCW === 'undefined') {
            THREE.FrontFaceDirectionCW = 1;
        }
        if (typeof THREE.VertexColors === 'undefined') {
            THREE.VertexColors = 2; // r121 might still use the constant
        }

        // Prevent addEventListener errors by ensuring objects that might be passed to event handlers have the method
        const ensureEventTarget = function(obj) {
            if (obj && typeof obj === 'object' && !obj.addEventListener) {
                obj.addEventListener = function() {
                    console.log('addEventListener called on non-DOM object (stubbed)');
                };
                obj.removeEventListener = function() {
                    console.log('removeEventListener called on non-DOM object (stubbed)');
                };
                obj.dispatchEvent = function() {
                    console.log('dispatchEvent called on non-DOM object (stubbed)');
                };
            }
            return obj;
        };

        // Override THREE constructors to ensure they have event methods if needed
        const wrapConstructor = function(originalConstructor) {
            return function(...args) {
                const instance = new originalConstructor(...args);
                return ensureEventTarget(instance);
            };
        };

        // Store original constructors before overriding
        window._originalTHREE = {
            Scene: THREE.Scene,
            PerspectiveCamera: THREE.PerspectiveCamera,
            Object3D: THREE.Object3D,
            Mesh: THREE.Mesh,
            Group: THREE.Group
        };

        // Override critical Three.js constructors to ensure they don't cause addEventListener errors
        ['Scene', 'PerspectiveCamera', 'Object3D', 'Mesh', 'Group', 'Material', 'MeshLambertMaterial', 'MeshBasicMaterial', 'LineBasicMaterial', 'BufferGeometry', 'Geometry'].forEach(className => {
            if (THREE[className]) {
                const OriginalClass = THREE[className];
                THREE[className] = function(...args) {
                    const instance = new OriginalClass(...args);
                    return ensureEventTarget(instance);
                };
                // Copy prototype and static properties
                THREE[className].prototype = OriginalClass.prototype;
                Object.setPrototypeOf(THREE[className], OriginalClass);
            }
        });

        // Global addEventListener patch - intercept all addEventListener calls
        const originalAddEventListener = EventTarget.prototype.addEventListener;

        // Create a safer addEventListener that handles non-EventTarget objects
        window.safeAddEventListener = function(target, type, listener, options) {
            try {
                // Check if target is a proper EventTarget
                if (target && typeof target.addEventListener === 'function' && target instanceof EventTarget) {
                    return originalAddEventListener.call(target, type, listener, options);
                } else if (target && typeof target.addEventListener === 'function') {
                    // Object has addEventListener but isn't EventTarget - call it anyway
                    return target.addEventListener(type, listener, options);
                } else {
                    // Object doesn't support events - log and ignore
                    console.warn('Attempted to add event listener to non-EventTarget object:', target);
                    return;
                }
            } catch (error) {
                console.warn('addEventListener failed:', error, 'Target:', target);
                return;
            }
        };

        // Patch Three.js objects that might be passed to addEventListener
        const patchThreeJSObject = function(obj) {
            if (obj && typeof obj === 'object' && !obj.addEventListener) {
                Object.defineProperty(obj, 'addEventListener', {
                    value: function(type, listener, options) {
                        console.log(`Stubbed addEventListener on Three.js object for event: ${type}`);
                        return;
                    },
                    writable: false,
                    enumerable: false,
                    configurable: true
                });
                Object.defineProperty(obj, 'removeEventListener', {
                    value: function(type, listener, options) {
                        console.log(`Stubbed removeEventListener on Three.js object for event: ${type}`);
                        return;
                    },
                    writable: false,
                    enumerable: false,
                    configurable: true
                });
                Object.defineProperty(obj, 'dispatchEvent', {
                    value: function(event) {
                        console.log(`Stubbed dispatchEvent on Three.js object for event:`, event);
                        return true;
                    },
                    writable: false,
                    enumerable: false,
                    configurable: true
                });
            }
            return obj;
        };

        // Simplified approach for r121 - just patch objects when they're created
        const originalSceneAdd = THREE.Scene.prototype.add;
        THREE.Scene.prototype.add = function(...objects) {
            objects.forEach(patchThreeJSObject);
            return originalSceneAdd.apply(this, objects);
        };

        // Override proto.js initialization after it loads
        window.addEventListener('load', function() {
            setTimeout(function() {
                console.log('Applying additional Three.js r128 compatibility fixes...');

                // 1. Fix renderer initialization if it wasn't caught by our override
                if (typeof renderer !== 'undefined' && renderer && renderer.setFaceCulling) {
                    renderer.setFaceCulling = function() {
                        console.log('setFaceCulling called on renderer (deprecated in r128)');
                        return this;
                    };
                }

                // 2. Replace projector with modern Raycaster (backup in case proto.js creates its own)
                if (typeof projector !== 'undefined' && !window.raycaster) {
                    window.raycaster = new THREE.Raycaster();
                }

                // Override the projector variable and its usage (backup)
                if (typeof projector !== 'undefined') {
                    window.projector = {
                        pickingRay: function(vector, camera) {
                            if (!window.raycaster) {
                                window.raycaster = new THREE.Raycaster();
                            }
                            window.raycaster.setFromCamera(vector, camera);
                            return window.raycaster;
                        },
                        unprojectVector: function(vector, camera) {
                            return vector.unproject(camera);
                        },
                        projectVector: function(vector, camera) {
                            return vector.project(camera);
                        }
                    };
                }

                // 3. Fix THREE.Plane.projectPoint() target parameter requirement
                const originalPlaneProjectPoint = THREE.Plane.prototype.projectPoint;
                THREE.Plane.prototype.projectPoint = function(point, target) {
                    // If no target provided, create one (required in modern Three.js)
                    if (!target) {
                        target = new THREE.Vector3();
                    }
                    return originalPlaneProjectPoint.call(this, point, target);
                };

                // Let proto.js use its original geometry functions if possible in r121
                // Only override if absolutely necessary for compatibility

                console.log('Three.js r121 should support legacy geometry APIs - minimal overrides only');

                console.log('Modern Three.js overrides applied');
            }, 500); // Wait a bit longer for proto.js to fully load
        });
    </script>

    <!-- Include the proto.js planet generation -->
    <script src="proto.js"></script>

    <!-- Enhanced UI Integration -->
    <script>
        // Enhanced UI variables
        let debugMode = false;
        let hoveredTile = null;

        // Initialize enhanced UI after proto.js loads
        $(document).ready(function() {
            initializeEnhancedUI();

            // Add tile highlighting functionality
            addTileHighlighting();

            // Generate initial planet
            setTimeout(() => {
                if (typeof generatePlanetAsynchronous === 'function') {
                    generatePlanetAsynchronous();
                }
            }, 1000);
        });

        function initializeEnhancedUI() {
            // Rendering mode buttons
            $('#terrainButton').click(() => setRenderingMode('terrain'));
            $('#plateButton').click(() => setRenderingMode('plates'));
            $('#temperatureButton').click(() => setRenderingMode('temperature'));
            $('#moistureButton').click(() => setRenderingMode('moisture'));

            // Control buttons
            $('#generateButton').click(() => {
                // Trigger the hidden proto.js button
                $('#generatePlanetButton').trigger('click');
            });

            $('#advancedButton').click(() => {
                $('#generationSettingsPanel').show();
            });

            $('#sunlightButton').click(toggleSunlight);
            $('#debugModeButton').click(toggleDebugMode);

            // Sliders
            $('#detailRange').on('input', function() {
                const value = parseInt(this.value);
                const labels = ['Low', 'Medium', 'High'];
                $('#detailValue').text(labels[value]);

                // Trigger appropriate detail button
                const buttons = ['#lowDetailButton', '#mediumDetailButton', '#highDetailButton'];
                $(buttons[value]).trigger('click');
            });

            $('#sunTimeRange').on('input', function() {
                const value = parseInt(this.value);
                $('#sunTimeValue').text(value);

                // Update sun time in proto.js
                if (typeof sunTimeOffset !== 'undefined') {
                    sunTimeOffset = value;
                }
            });

            $('#zoomRange').on('input', function() {
                const value = parseFloat(this.value);
                $('#zoomValue').text(value.toFixed(1));

                // Update zoom in proto.js
                if (typeof zoom !== 'undefined') {
                    zoom = value;
                    if (typeof updateCamera === 'function') {
                        updateCamera();
                    }
                }
            });
        }

        function setRenderingMode(mode) {
            // Update button states
            $('.ui button').removeClass('active');
            $(`#${mode}Button`).addClass('active');

            // Set rendering mode in proto.js
            if (typeof setSurfaceRenderMode === 'function') {
                const modeMap = {
                    'terrain': 'terrain',
                    'plates': 'plates',
                    'temperature': 'temperature',
                    'moisture': 'moisture'
                };
                setSurfaceRenderMode(modeMap[mode]);
            }
        }

        function toggleSunlight() {
            const isOn = $('#sunlightButton').text().includes('On');
            const newState = !isOn;
            $('#sunlightButton').text(`Sunlight: ${newState ? 'On' : 'Off'}`);
            $('#sunlightButton').toggleClass('active', newState);

            if (typeof showHideSunlight === 'function') {
                showHideSunlight(newState);
            }
        }

        function toggleDebugMode() {
            debugMode = !debugMode;
            $('#debugModeButton').text(`Debug Mode: ${debugMode ? 'On' : 'Off'}`);
            $('#debugModeButton').toggleClass('active', debugMode);
            $('#debug-overlay').toggle(debugMode);
        }

        function addTileHighlighting() {
            // Add mouse interaction for tile highlighting
            $(document).mousemove(function(event) {
                if (!debugMode || !planet) return;

                // This would need to be implemented with proper raycasting
                // For now, just show placeholder debug info
                if (debugMode) {
                    $('#debug-content').html(`
                        <strong>Tile Debug Info</strong><br>
                        Mouse: ${event.clientX}, ${event.clientY}<br>
                        Planet: ${planet ? 'Loaded' : 'Not loaded'}<br>
                        Triangles: ${planet && planet.topology ? planet.topology.triangles.length : 0}
                    `);
                }
            });
        }

        // Progress update function for proto.js
        function updateProgressUI(action) {
            if (action && action.getDescription) {
                $('#progressText').text(action.getDescription());
            }
        }

        // Resize handler
        function resizeHandler() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // Add resize listener
        window.addEventListener('resize', resizeHandler);
    </script>
</body>
</html>
